# 파일 목적: PR과 main 푸시마다 서버 코드를 자동 검증한다. (기획서 08 "브랜치·배포")
# 통과 조건 = ktlint(서식) + detekt(주석 규칙 포함 정적 분석) + 테스트(Testcontainers PostgreSQL).
# 이 워크플로가 빨간불이면 PR을 머지하지 않는다.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# 같은 브랜치에 새 커밋이 오면 이전 실행을 취소해 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · detekt · test
    runs-on: ubuntu-latest # Docker가 기본 탑재되어 Testcontainers가 바로 동작한다.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정 (의존성 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 검사 실행 (ktlint + detekt + test)
        run: ./gradlew check --no-daemon --stacktrace

      - name: detekt 리포트를 코드 스캔 탭에 업로드
        if: always() # 검사가 실패해도 리포트는 올린다.
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/detekt.sarif
        continue-on-error: true

      - name: 테스트 리포트 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7
