# 파일 목적: 로컬 개발용 PostgreSQL을 명령 한 줄로 띄운다.
#
# 사용법:
#   docker compose up -d      # 백그라운드로 시작 (처음 한 번은 이미지 다운로드 ~90MB)
#   docker compose down       # 중지 (데이터는 볼륨에 남음)
#   docker compose down -v    # 중지 + 데이터 완전 삭제 (스키마를 처음부터 다시 만들고 싶을 때)
#
# 접속 정보는 application.yml의 기본값과 같다. 운영 서버는 이 파일이 아니라 Sprint 6의
# deploy/docker-compose.prod.yml 을 쓴다(서버 컨테이너 + Caddy 포함).

services:
  postgres:
    image: postgres:16-alpine # 운영과 같은 메이저 버전. alpine은 용량이 작다.
    container_name: praylist-postgres
    environment:
      POSTGRES_DB: praylist
      POSTGRES_USER: praylist
      POSTGRES_PASSWORD: praylist-local # 로컬 전용. 운영 비밀번호는 절대 저장소에 넣지 않는다.
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      # 컨테이너를 지워도 데이터가 남도록 이름 있는 볼륨에 저장한다.
      - praylist-pgdata:/var/lib/postgresql/data
    healthcheck:
      # 서버가 DB보다 먼저 떠서 연결 실패로 죽는 일을 막기 위해 준비 상태를 노출한다.
      test: ["CMD-SHELL", "pg_isready -U praylist -d praylist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  praylist-pgdata:
