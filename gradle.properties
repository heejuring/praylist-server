# Gradle 데몬 JVM 메모리. 기본값(512m)으로는 Kotlin 컴파일 + detekt를 함께 돌릴 때 OOM이 난다.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# 빌드 결과 캐시. 바뀌지 않은 태스크는 다시 실행하지 않아 로컬·CI 모두 빨라진다.
org.gradle.caching=true
# 설정 단계 캐시(Gradle 9 권장). 두 번째 빌드부터 설정 시간이 거의 0이 된다.
org.gradle.configuration-cache=true
# Kotlin 컴파일러를 별도 데몬에서 돌린다(기본값이지만 명시).
kotlin.code.style=official
